<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#101014"/><title>Arquivo X — Minha coleção</title><style>html,body{margin:0;min-height:100%;background:#101014;color:#f3f1ee}#root{min-height:100vh}.boot-loader{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;color:#aaa5ad;font:11px Arial;letter-spacing:1.5px}.boot-mark{display:grid;place-items:center;width:54px;height:54px;background:#e14a40;color:white;font-size:40px;font-weight:900;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}.boot-spinner{width:24px;height:24px;border:2px solid #39343d;border-top-color:#e65349;border-radius:50%;animation:boot-spin .75s linear infinite}@keyframes boot-spin{to{transform:rotate(360deg)}}</style></head><body><div id="root"><div class="boot-loader" role="status"><div class="boot-mark">X</div><div class="boot-spinner"></div><span>ABRINDO ARQUIVO X</span></div></div><script type="module" src="/src/main.jsx"></script></body></html>
